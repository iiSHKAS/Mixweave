[package]
name = "mixweave"
default-run = "mixweave"
version = "0.5.1"
description = "Linux-native audio routing and mixing for PipeWire"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"

[lib]
name = "mixweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
# Native open/save pickers for EQ preset import/export; the file I/O itself
# stays in our own commands (no fs plugin / scope surface needed).
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
libc = "0.2"
# 0.8.0 on crates.io predates PipeWire 1.6 headers (libspa bindgen breaks);
# git main carries the header fixes. v0_3_49 gates Buffer::requested().
# RNNoise port for the microphone noise-suppression stage (pure Rust, BSD-3-Clause).
# WebRTC AEC3 echo canceller (pure Rust port, BSD-3-Clause).
sonora = "0.2"
nnnoiseless = { version = "0.5", default-features = false }
pipewire = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs", rev = "v0.10.0", features = ["v0_3_49"] }
tauri-plugin-updater = "2"
tempfile = "3"
tokio = { version = "1.53.1", features = ["time", "sync", "macros"] }
tauri-plugin-notification = "2"

