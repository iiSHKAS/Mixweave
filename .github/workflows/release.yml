name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in X.Y.Z form"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Mixweave's PipeWire bindings require headers newer than Ubuntu 22.04 ships.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: version
        name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=${GITHUB_REF_NAME#v}
            tag=$GITHUB_REF_NAME
          else
            version=$INPUT_VERSION
            tag=v$version
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must use X.Y.Z format" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.2
        with:
          workspaces: .

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libmysofa-dev \
            libfftw3-dev \
            librsvg2-dev \
            squashfs-tools \
            clang

      - run: npm ci
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Validate updater configuration
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node "قيتهب ابديت/build-config.mjs"

      - name: Build Linux packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # linuxdeploy's bundled strip cannot read modern ELF RELR sections.
          # Skipping this optional size optimization keeps AppImage packaging
          # compatible with current Ubuntu libraries.
          NO_STRIP: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --verbose --ci --bundles deb,rpm,appimage \
            --config update-build.json

      - name: Sign version-bound AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          appimage=$(find target/release/bundle/appimage -name '*.AppImage' -print -quit)
          test -n "$appimage"
          cargo run --locked --manifest-path "قيتهب ابديت/signing/Cargo.toml" -- "$VERSION" "$appimage"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig

  arch:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-packages
          path: bundles

      - name: Build Arch package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          deb=$(find bundles -name 'Mixweave_*_amd64.deb' -print -quit)
          useradd -m builder
          install -d -o builder /build
          cp "$deb" /build/mixweave.deb
          cp packaging/arch/PKGBUILD /build/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" /build/PKGBUILD
          chown -R builder:builder /build
          runuser -u builder -- bash -lc 'cd /build && makepkg --noconfirm --nodeps'
          cp /build/mixweave-bin-*-x86_64.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arch-package
          path: mixweave-bin-*-x86_64.pkg.tar.zst

  publish:
    needs: [build, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release
          merge-multiple: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Create checksums
        run: |
          mkdir upload
          find release -type f \( \
            -name '*.deb' -o -name '*.rpm' -o \
            -name '*.pkg.tar.zst' \
          \) -exec cp {} upload/ \;
          cd upload
          sha256sum *.deb *.rpm *.pkg.tar.zst > PACKAGE_SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 == "## [" version "]" || \
              index($0, "## [" version "] - ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          appimage=$(find release -name '*.AppImage' -print -quit)
          test -n "$appimage"
          node "قيتهب ابديت/prepare-release.mjs" "$VERSION" "$appimage" "$appimage.sig" upload release-notes.md
          cat upload/PACKAGE_SHA256SUMS >> upload/SHA256SUMS
          rm upload/PACKAGE_SHA256SUMS
          gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --title "Mixweave $TAG" upload/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
